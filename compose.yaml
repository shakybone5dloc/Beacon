services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beacon
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beacon"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  
  api:
    build:
      context: .
      dockerfile: src/Beacon.Api/Dockerfile
    environment:
      ConnectionStrings__Beacon: "Host=db;Port=5432;Database=beacon;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Ai__Endpoint: "http://ollama:11434"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      
  web:
    build:
      context: .
      dockerfile: src/Beacon.Web/Dockerfile
    environment:
      BeaconApi__BaseUrl: "http://api:8080/"
    ports:
      - "8080:8080"
    depends_on:
      - api


volumes:
  db-data:
  ollama-models: