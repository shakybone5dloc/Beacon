x-db-connection: &db-connection "Host=db;Port=5432;Database=beacon;Username=postgres;Password=${POSTGRES_PASSWORD}"
x-embedding-model: &embedding-model ${EMBEDDING_MODEL:-nomic-embed-text}
x-chat-model: &chat-model ${CHAT_MODEL:-llama3.2}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beacon
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beacon"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: src/Beacon.Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__Beacon: *db-connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Beacon.Api/Dockerfile
      target: runtime
    environment:
      ConnectionStrings__Beacon: *db-connection
      Ai__Endpoint: "http://ollama:11434"
      Ai__EmbeddingModel: *embedding-model
      Ai__ChatModel: *chat-model
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/Beacon.Web/Dockerfile
    environment:
      BeaconApi__BaseUrl: "http://api:8080/"
      DataProtection__KeysPath: "/keys"
    volumes:
      - web-keys:/keys
    ports:
      - "8080:8080"
    depends_on:
      - api
      
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      EMBEDDING_MODEL: *embedding-model
      CHAT_MODEL: *chat-model
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$EMBEDDING_MODEL\" && ollama pull \"$$CHAT_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  ollama-models:
  web-keys: